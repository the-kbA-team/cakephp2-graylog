name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php_version }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.1', '8.5']
        dependencies: ['default', 'lowest']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          extensions: intl, mbstring
          tools: composer:v2
          coverage: pcov
      - name: Validate Composer configuration
        run: make validate QA_NATIVE=1 PHP_VERSION=${{ matrix.php_version }}
      - name: Install, test and audit
        run: make check QA_NATIVE=1 PHP_VERSION=${{ matrix.php_version }} DEPENDENCIES_LOWEST=${{ matrix.dependencies == 'lowest' && '1' || '0' }}
