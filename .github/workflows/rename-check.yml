name: Rename prerequisite checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rename-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php_version }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.1', '8.5']
        dependencies: ['default', 'lowest']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          extensions: mbstring
          tools: composer:v2, phpstan:${{ matrix.dependencies == 'lowest' && '2.1.0' || '2.3.7' }}
          coverage: pcov
      - run: composer validate --strict --no-check-lock
      - name: Resolve dependencies
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          if [ "$DEPENDENCIES" = lowest ]; then
            composer update --prefer-lowest --prefer-dist --no-interaction --no-progress
          else
            composer update --prefer-dist --no-interaction --no-progress
          fi
      - name: Lint PHP files
        run: find Lib tests -type f -name '*.php' -exec sh -c 'for file do php -l "$file" || exit; done' sh {} +
      - run: php vendor/bin/phpunit --do-not-cache-result --coverage-clover clover.xml
      - run: phpstan analyse --configuration=phpstan-rename.neon --no-progress
      - run: composer audit --locked
